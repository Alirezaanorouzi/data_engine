services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dataengine
      POSTGRES_PASSWORD: dataengine
      POSTGRES_DB: dataengine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataengine -d dataengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  parse-worker:
    build: ./worker
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
    volumes:
      - ./storage:/storage:ro

volumes:
  pgdata:
